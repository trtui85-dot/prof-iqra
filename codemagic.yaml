# ============================================================
#  Codemagic — build iOS depuis Windows (sans Mac)
#  Clé API App Store Connect connectée côté équipe sous le nom :
#  « Codemagic Iqra »
# ============================================================

name: Asatida Iqra
type: flutter

workflows:
  # ---------------------------------------------------------
  #  Archive iOS signé
  # ---------------------------------------------------------
  ios_archive:
    name: iOS Archive
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic Iqra
    scripts:
      - name: Prepare app config
        script: cp tool/ci_supabase.env .env
      - name: Resolve dependencies
        script: flutter pub get
      - name: Prepare Xcode project
        script: flutter build ios --release --config-only --no-codesign
      - name: Install pods
        script: cd ios && pod install
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch or create signing files
        script: app-store-connect fetch-signing-files com.iqra.prof --type IOS_APP_STORE --create
      - name: Add signing certificates
        script: keychain add-certificates
      - name: Apply signing settings
        script: xcode-project use-profiles
      - name: Archive
        script: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release \
            -archivePath "$HOME/Runner.xcarchive" \
            CODE_SIGN_ENTITLEMENTS=Runner/Runner.entitlements \
            archive

  # ---------------------------------------------------------
  #  Archive + envoi à App Store Connect / TestFlight
  # ---------------------------------------------------------
  ios_release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic Iqra
    scripts:
      - name: Prepare app config
        script: cp tool/ci_supabase.env .env
      - name: Resolve dependencies
        script: flutter pub get
      - name: Prepare Xcode project
        script: flutter build ios --release --config-only --no-codesign
      - name: Install pods
        script: cd ios && pod install
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch or create signing files
        script: app-store-connect fetch-signing-files com.iqra.prof --type IOS_APP_STORE --create
      - name: Add signing certificates
        script: keychain add-certificates
      - name: Apply signing settings
        script: xcode-project use-profiles
      - name: Archive
        script: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release \
            -archivePath "$HOME/Runner.xcarchive" \
            CODE_SIGN_ENTITLEMENTS=Runner/Runner.entitlements \
            archive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false